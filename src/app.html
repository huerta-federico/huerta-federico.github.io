<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />

	<!-- Simple Analytics (100% privacy-first analytics) -->
	<script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>

	<!-- Particle JS script (deferred so it never blocks initial page render) -->
	<script defer src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"
		integrity="sha512-Kef5sc7gfTacR7TZKelcrRs15ipf7+t+n7Zh6mKNJbmW+/RRdCW9nwfLn4YX0s2nO6Kv5Y2ChqgIakaC6PW09A=="
		crossorigin="anonymous" referrerpolicy="no-referrer"></script>

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />

	<!-- Google Fonts: Roboto & Poppins -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
		rel="stylesheet" />

	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager" class="bg-slate-950 text-white relative">
	<div style="display: contents" class="relative z-[1]">
		%sveltekit.body%
	</div>

	<!-- Pinned to viewport (fixed inset-0) instead of stretching to full page height -->
	<div class="fixed inset-0 z-[-1] opacity-50 pointer-events-none">
		<!-- Desktop: Lightweight particle animation -->
		<div class="absolute inset-0 hidden lg:block" id="particles-js-desktop"></div>

		<!-- Mobile / Tablet: Static ambient radial gradient (zero JS/animation overhead) -->
		<div
			class="absolute inset-0 lg:hidden bg-[radial-gradient(ellipse_80%_50%_at_50%_-10%,rgba(124,58,237,0.22),rgba(2,6,23,0))]">
		</div>
	</div>

	<script>
		window.addEventListener("DOMContentLoaded", function () {
			const isMobile =
				/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
				window.innerWidth < 1024;
			const isLowPerformance =
				(navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) ||
				window.matchMedia("(prefers-reduced-motion: reduce)").matches;

			if (!isMobile && !isLowPerformance && typeof particlesJS !== "undefined") {
				particlesJS.load(
					"particles-js-desktop",
					"%sveltekit.assets%/assets/particles.json",
					function () {
						let isPaused = false;

						function pauseParticles() {
							const pJS = window.pJSDom?.[0]?.pJS;
							if (!pJS || isPaused) return;

							isPaused = true;
							pJS.particles.move.enable = false;
							if (pJS.fn.drawAnimFrame) {
								cancelAnimationFrame(pJS.fn.drawAnimFrame);
								pJS.fn.drawAnimFrame = null;
							}
						}

						function resumeParticles() {
							const pJS = window.pJSDom?.[0]?.pJS;
							if (!pJS || !isPaused || document.hidden) return;

							isPaused = false;
							pJS.particles.move.enable = true;
							pJS.fn.vendors.draw();
						}

						// Pause when tab is hidden OR browser window loses focus
						document.addEventListener("visibilitychange", () => {
							if (document.hidden) {
								pauseParticles();
							} else {
								resumeParticles();
							}
						});

						window.addEventListener("blur", pauseParticles);
						window.addEventListener("focus", resumeParticles);
					}
				);
			}
		});
	</script>
</body>

</html>
